<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebSocket Broadcast Tester</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #111716;
        color: #e8f1ed;
      }

      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; }
      main { margin: 0 auto; max-width: 860px; padding: 48px 24px; }
      h1 { font-size: clamp(2rem, 6vw, 4.2rem); letter-spacing: -0.07em; line-height: .95; margin: 0; }
      .subtitle { color: #9db0a8; font-size: 1.05rem; max-width: 600px; margin: 20px 0 34px; }
      .panel { background: #18211f; border: 1px solid #2c3c37; border-radius: 16px; padding: 20px; margin-top: 16px; }
      label { display: block; color: #b9c9c2; font-size: .8rem; font-weight: 700; letter-spacing: .08em; margin-bottom: 8px; text-transform: uppercase; }
      input, textarea { background: #0e1412; border: 1px solid #40514a; border-radius: 8px; color: inherit; font: inherit; padding: 12px; width: 100%; }
      textarea { min-height: 112px; resize: vertical; }
      input:focus, textarea:focus { border-color: #67d6a3; box-shadow: 0 0 0 3px #67d6a32b; outline: none; }
      .row { align-items: end; display: flex; gap: 12px; }
      .grow { flex: 1; }
      button { background: #67d6a3; border: 0; border-radius: 8px; color: #102219; cursor: pointer; font: inherit; font-weight: 800; padding: 12px 17px; }
      button:hover:not(:disabled) { background: #8ce6bb; }
      button:disabled { cursor: not-allowed; opacity: .45; }
      button.secondary { background: transparent; border: 1px solid #56685f; color: #d4e1da; }
      .status { align-items: center; color: #b9c9c2; display: flex; font-size: .9rem; gap: 8px; margin-top: 14px; }
      .dot { background: #77847e; border-radius: 50%; height: 9px; width: 9px; }
      .connected .dot { background: #67d6a3; box-shadow: 0 0 10px #67d6a3; }
      .messages { display: grid; gap: 10px; min-height: 120px; }
      .message { background: #0e1412; border-left: 3px solid #67d6a3; border-radius: 4px 8px 8px 4px; padding: 12px; }
      .message small, .event { color: #8fa299; display: block; font-size: .78rem; margin-top: 5px; }
      .event { border-bottom: 1px solid #2c3c37; font-family: ui-monospace, monospace; padding: 7px 0; }
      .empty { color: #788a82; font-style: italic; margin: auto 0; }
      .section-title { align-items: center; display: flex; justify-content: space-between; margin-bottom: 14px; }
      .section-title h2 { font-size: 1rem; letter-spacing: .02em; margin: 0; }
      .clear { font-size: .8rem; padding: 6px 9px; }
      @media (max-width: 600px) { .row { align-items: stretch; flex-direction: column; } main { padding: 30px 16px; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Socket<br />Broadcast Tester</h1>
      <p class="subtitle">Connect two browser tabs, send a message from either one, and watch the broadcast arrive in both.</p>

      <section class="panel" aria-label="Connection settings">
        <div class="row">
          <div class="grow">
            <label for="endpoint">WebSocket endpoint</label>
            <input id="endpoint" type="url" placeholder="wss://your-api.execute-api.us-east-1.amazonaws.com/dev" autocomplete="off" />
          </div>
          <button id="connect" type="button">Connect</button>
          <button id="disconnect" class="secondary" type="button" disabled>Disconnect</button>
        </div>
        <div id="status" class="status"><span class="dot"></span><span>Disconnected</span></div>
      </section>

      <section class="panel" aria-label="Send message">
        <label for="message">Message</label>
        <textarea id="message" placeholder="Write a broadcast message..." disabled></textarea>
        <div class="row" style="justify-content: end; margin-top: 12px;">
          <button id="send" type="button" disabled>Broadcast</button>
        </div>
      </section>

      <section class="panel" aria-live="polite">
        <div class="section-title"><h2>Received Messages</h2><button id="clear-messages" class="secondary clear" type="button">Clear</button></div>
        <div id="messages" class="messages"><p class="empty">No broadcasts received yet.</p></div>
      </section>

      <section class="panel" aria-live="polite">
        <div class="section-title"><h2>Connection Log</h2><button id="clear-log" class="secondary clear" type="button">Clear</button></div>
        <div id="log"><p class="empty">Waiting to connect.</p></div>
      </section>
    </main>

    <script>
      const endpoint = document.querySelector("#endpoint");
      const connectButton = document.querySelector("#connect");
      const disconnectButton = document.querySelector("#disconnect");
      const sendButton = document.querySelector("#send");
      const messageInput = document.querySelector("#message");
      const status = document.querySelector("#status");
      const messages = document.querySelector("#messages");
      const log = document.querySelector("#log");
      let socket;

      endpoint.value = new URLSearchParams(window.location.search).get("endpoint") || localStorage.getItem("websocket-endpoint") || "";

      function setStatus(text, connected) {
        status.classList.toggle("connected", connected);
        status.lastElementChild.textContent = text;
        connectButton.disabled = connected;
        disconnectButton.disabled = !connected;
        sendButton.disabled = !connected;
        messageInput.disabled = !connected;
      }

      function addLog(text) {
        log.querySelector(".empty")?.remove();
        const entry = document.createElement("div");
        entry.className = "event";
        entry.textContent = `${new Date().toLocaleTimeString()}  ${text}`;
        log.prepend(entry);
      }

      function addMessage(payload) {
        messages.querySelector(".empty")?.remove();
        const entry = document.createElement("article");
        entry.className = "message";
        const content = document.createElement("div");
        content.textContent = payload.message || JSON.stringify(payload);
        const sender = document.createElement("small");
        sender.textContent = payload.senderConnectionId ? `sender: ${payload.senderConnectionId}` : "unstructured message";
        entry.append(content, sender);
        messages.prepend(entry);
      }

      connectButton.addEventListener("click", () => {
        const value = endpoint.value.trim();
        if (!/^wss?:\/\//.test(value)) {
          addLog("Enter a ws:// or wss:// endpoint.");
          return;
        }
        localStorage.setItem("websocket-endpoint", value);
        setStatus("Connecting...", false);
        socket = new WebSocket(value);
        socket.addEventListener("open", () => { setStatus("Connected", true); addLog("Connected."); });
        socket.addEventListener("close", () => { setStatus("Disconnected", false); addLog("Disconnected."); });
        socket.addEventListener("error", () => addLog("Connection error. Check the endpoint and browser console."));
        socket.addEventListener("message", (event) => {
          try { addMessage(JSON.parse(event.data)); } catch { addMessage({ message: event.data }); }
        });
      });

      disconnectButton.addEventListener("click", () => socket?.close());
      sendButton.addEventListener("click", () => {
        const message = messageInput.value.trim();
        if (!message) return;
        socket.send(JSON.stringify({ action: "sendmessage", message }));
        addLog("Broadcast sent.");
        messageInput.value = "";
      });
      messageInput.addEventListener("keydown", (event) => {
        if ((event.ctrlKey || event.metaKey) && event.key === "Enter") sendButton.click();
      });
      document.querySelector("#clear-messages").addEventListener("click", () => { messages.replaceChildren(); });
      document.querySelector("#clear-log").addEventListener("click", () => { log.replaceChildren(); });
    </script>
  </body>
</html>
